[package]
name = "iwtui"
version = "0.0.1"
edition = "2024"
description = "A drop-in nmtui-style TUI for iwd (Intel Wireless Daemon)"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["iwd", "wifi", "tui", "nmtui", "wireless"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
zbus = { version = "4.4", default-features = false, features = ["tokio"] }
tokio = { version = "1.0", default-features = false, features = ["rt", "macros", "sync", "time"] }
futures-util = "0.3"

[profile.release]
opt-level = 1
lto = false
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = false
incremental = true

[profile.dev.package."*"]
opt-level = 2
